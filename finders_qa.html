  { cat:'checkout', q:'可以開立統一發票嗎？', a:[{lines:[
    '到店付款之訂單均在入住時現場開立發票，若有統編需求請於訂房時或入住當天告知工作人員並提供統編。',
    '若經由其他訂房平台預訂，部分平台採預先付款機制，將由訂房平台開立收據或發票，恕現場無法配合開立，請事先確認自己的報銷需求。'
  ]}]},
  { cat:'checkout', q:'退房後還可以寄存行李嗎？', a:[{lines:[
    '退房後仍可以寄存行李，貴重物品請自行隨身攜帶。',
    '行李請當日取走，無寄放過夜之服務，若有需求請洽火車站行李房。'
  ]}]},
];

let activeCat='all', searchTerm='';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlRaw(text,term){
  if(/<[a-z]/i.test(text)){
    if(!term) return text;
    const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    return text.replace(re,m=>'<span class="highlight">'+m+'</span>');
  }
  return hl(text,term);
}
function hl(text,term){
  if(!term) return esc(text);
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return esc(text).replace(re,m=>'<span class="highlight">'+m+'</span>');
}
function renderA(blocks,term){
  return blocks.map(b=>{
    const lines=b.lines.map(l=>'<p>'+hlRaw(l,term)+'</p>').join('');
    if(b.title) return '<div class="grp"><div class="grp-title">【'+hl(b.title,term)+'】</div>'+lines+'</div>';
    return '<div class="grp">'+lines+'</div>';
  }).join('');
}
function flatText(blocks){ return blocks.map(b=>(b.title||'')+' '+b.lines.join(' ')).join(' '); }

function render(){
  const list=document.getElementById('qa-list');
  const term=searchTerm.trim(), tl=term.toLowerCase();
  const filtered=QA.filter(item=>{
    const catOk=activeCat==='all'||item.cat===activeCat;
    const full=(item.q+' '+flatText(item.a)).toLowerCase();
    return catOk&&(!tl||full.includes(tl));
  });
  if(!filtered.length){
    list.innerHTML='<div class="no-results">找不到相關問題，試試其他關鍵字</div>';
    return;
  }
  const groups={};
  filtered.forEach(item=>{ if(!groups[item.cat]) groups[item.cat]=[]; groups[item.cat].push(item); });
  const order=['booking','arrival','policy','facilities','checkout'];
  let html='';
  order.forEach(cat=>{
    if(!groups[cat]) return;
    if(activeCat==='all') html+='<div class="sec-label">'+CAT[cat].label+'</div>';
    groups[cat].forEach((item,idx)=>{
      const id=cat+idx;
      html+='<div class="qa-item"><div class="qa-q" onclick="tog(\''+id+'\')"><div class="q-left"><div class="cat-dot" style="background:'+CAT[cat].color+'"></div><div class="q-text">'+hl(item.q,term)+'</div></div><span class="chevron" id="chev-'+id+'">&#8964;</span></div><div class="qa-a" id="ans-'+id+'">'+renderA(item.a,term)+'</div></div>';
    });
  });
  list.innerHTML=html;
  if(tl){
    filtered.forEach(item=>{
      const cat=item.cat,idx=groups[cat].indexOf(item),id=cat+idx;
      const a=document.getElementById('ans-'+id),c=document.getElementById('chev-'+id);
      if(a){a.classList.add('open');c.classList.add('open');}
    });
  }
}
function tog(id){
  const a=document.getElementById('ans-'+id),c=document.getElementById('chev-'+id);
  c.classList.toggle('open',a.classList.toggle('open'));
}
document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeCat=btn.dataset.cat; render();
  });
});
document.getElementById('search-input').addEventListener('input',e=>{
  searchTerm=e.target.value;
  if(searchTerm.trim()){
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('[data-cat="all"]').classList.add('active');
    activeCat='all';
  }
  render();
});
render();
</script>
</body>
</html>
